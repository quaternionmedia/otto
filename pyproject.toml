[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project]
name = "al-otto"
dynamic = ["version"]
description = "The ottomatic video engine"
authors = [
    {name = "Quaternion Media", email = "qm@quaternion.media"}
]
dependencies = [
    # 0.100 is the first FastAPI on pydantic 2.
    "fastapi~=0.100",
    # moviepy 2 is another API (no moviepy.editor, renamed methods); otto is
    # written against 1.0.3.
    "moviepy>=1.0.3,<2",
    # Imported by otto directly, not only through moviepy.
    "numpy>=1.17.3",
    # 9.5 is what alfred pins; 10 and later need the shim in otto/__init__.py.
    "Pillow>=9.5",
    "pydantic~=2.5",
    "requests~=2.28",
    "tqdm~=4.65",
]
# 3.11 is what CI and the Dockerfile run. pydantic no longer holds the cap:
# docs/index.md#install says what raising it takes.
requires-python = ">=3.8.1,<3.12"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/quaternionmedia/otto"
documentation = "https://quaternionmedia.github.io/otto/"
repository = "https://github.com/quaternionmedia/otto"

[project.optional-dependencies]
render = [
    "gizeh~=0.1",
]
test = [
    "pytest~=7.3",
    "httpx~=0.24",
    "pytest-cov~=4.0",
    "pytest-xdist~=3.2",
]
docs = [
    "mkdocs~=1.4",
    "mkdocs-material~=9.1",
    "mkdocs-git-revision-date-localized-plugin~=1.2",
    "mike~=1.1",
    "mkdocstrings[python]~=0.21",
    "setuptools~=67.6",
]

[tool.pdm.dev-dependencies]
dev = [
    "uvicorn~=0.21",
    "black~=23.3",
    "ruff~=0.0",
]
nox = [
    "nox~=2022.11",
]


[tool.pdm]
version = { source = "file", path = "otto/_version.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: draws text or shapes; needs ImageMagick (with fonts and a policy allowing @file text) and cairo",
]

[tool.black]
skip-string-normalization = true

[tool.ruff]
# Explicit, because without it ruff applies its own default rule set, which
# has grown to report style (unneeded `pass`, executable bits, `int(round())`)
# far more than mistakes. These are ruff's long-standing defaults plus import
# sorting and bugbear. Layout is Black's (`-S`).
target-version = "py38"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

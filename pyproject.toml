[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[project]
name = "al-otto"
dynamic = ["version"]
description = "The ottomatic video engine"
authors = [
    {name = "Quaternion Media", email = "qm@quaternion.media"}
]
dependencies = [
    "fastapi~=0.95",
    # moviepy 2 is another API (no moviepy.editor, renamed methods); otto is
    # written against 1.0.3.
    "moviepy>=1.0.3,<2",
    # Imported by otto directly, not only through moviepy.
    "numpy>=1.17.3",
    # 9.5 is what alfred pins; 10 and later need the shim in otto/__init__.py.
    "Pillow>=9.5",
    "pydantic~=1.10",
    "requests~=2.28",
    "tqdm~=4.65",
]
# Capped at the newest Python every allowed pydantic supports: `pydantic~=1.10`
# admits 1.10.0-1.10.15, whose last supported Python is 3.11 (3.12 needs
# 1.10.17, 3.13 needs 1.10.21, 3.14 needs 1.10.25). Raise the cap together with
# the pydantic floor.
requires-python = ">=3.8.1,<3.12"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/quaternionmedia/otto"
documentation = "https://quaternionmedia.github.io/otto/"
repository = "https://github.com/quaternionmedia/otto"

[project.optional-dependencies]
render = [
    "gizeh~=0.1",
    "bezier~=2021.2",
]
test = [
    "pytest~=7.3",
    "httpx~=0.24",
    "pytest-cov~=4.0",
    "pytest-xdist~=3.2",
]
docs = [
    "mkdocs~=1.4",
    "mkdocs-material~=9.1",
    "mkdocs-git-revision-date-localized-plugin~=1.2",
    "mike~=1.1",
    "mkdocstrings[python]~=0.21",
    "setuptools~=67.6",
]

[tool.pdm.dev-dependencies]
dev = [
    "uvicorn~=0.21",
    "black~=23.3",
    "ruff~=0.0",
]
nox = [
    "nox~=2022.11",
]


[tool.pdm]
version = { source = "file", path = "otto/_version.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]

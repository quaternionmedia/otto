name: 🐍 Otto pytest

on:
  workflow_call:
    inputs:
      python_version:
        description: The version of python to setup
        type: string
        default: 3.11

      pip_extras:
        description: A list of pip extras to install
        type: string
        default: '[test]'

      pytest_args:
        description: Additional args to pass to pytest.
        type: string

jobs:
  run_pytest:
    name: 🐍 pytest
    runs-on: ubuntu-latest
    environment: codecov

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@main
        id: setup-python
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: 🏗️ Install dependencies
        run: pip install .${{ inputs.pip_extras }}

      # ImageMagick from apt, not the AppImage this used: that needed libfuse2,
      # which ubuntu-24.04 renamed libfuse2t64, and was installed without an
      # apt-get update. The policy file it then deleted was ImageMagick 6's,
      # which the runner image no longer ships, so `rm` failed the job.
      #
      # moviepy hands text to ImageMagick as `@file`, which the distribution
      # policy forbids; that one rule is removed rather than the whole policy.
      - name: 🖼️ Install ImageMagick, fonts and cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick libcairo2 fonts-open-sans fonts-urw-base35
          for policy in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$policy" ]; then sudo sed -i '/pattern="@\*"/d' "$policy"; fi
          done

      - name: 🛸 Configure extra test dependencies
        run: mkdir -p data

      - name: 🧪 Run pytest suite
        run: pytest -v --cov --cov-report lcov ${{ inputs.pytest_args }}

      - name: 📈 Uploade coverage report
        # always run this step, even if the tests fail
        # putting always() would cause the function to run even if the build is canceled
        if: success() || failure()
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

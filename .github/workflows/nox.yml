name: 🛢️ nox

on:
  workflow_call:
    inputs:
      args:
        required: true
        type: string

jobs:
  run_nox:
    name: 🛢️ nox
    runs-on: ubuntu-latest

    steps:
      - name: 📰 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # nox installs each session's own dependencies; it only needs itself.
      # This read a requirements-tests.txt the repository does not have.
      - name: 🏗️ Setup testing environment
        run: pip3 install nox

      - name: 🧪 Run nox test suite
        run: nox -s ${{ inputs.args }}
